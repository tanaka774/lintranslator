[project]
name = "lintranslator"
version = "0.1.0"
description = "Screen translator for Linux: watches a screen region, reads it with OCR and translates it (Wayland/KDE first)"
readme = "README.md"
# The app is MIT. The models it downloads are not: NLLB is CC-BY-NC-4.0
# (non-commercial). See NOTICE.
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "tanaka" }]
keywords = [
    "translation",
    "ocr",
    "tesseract",
    "screen-capture",
    "wayland",
    "kde",
    "games",
    "overlay",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: GTK",
    "Environment :: X11 Applications :: KDE",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Japanese",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Text Processing :: Linguistic",
]
# Tested on 3.12 (the floor: 275 tests plus 4 GTK modules skipped, since
# PyGObject is a system package) and on 3.14, which is what the development venv
# runs. It used to say `<3.14`, which made pip refuse to install on the very
# interpreter the suite is green on.
requires-python = ">=3.12,<3.15"
dependencies = [
    "pillow>=10.0",
    "jeepney>=0.9",
    "pytesseract>=0.3.13",
]

[project.optional-dependencies]
# Recommended local backend: int8 NLLB via CTranslate2. The tokenizer still
# comes from transformers, but no torch is needed to run inference.
ct2 = [
    "ctranslate2>=4.0",
    "transformers>=4.40,<5",
    "sentencepiece>=0.2",
]
# The slower transformers path, for models that cannot be converted or as a
# fallback if CTranslate2 is unavailable. Pulls in torch.
local = [
    "transformers>=4.40,<5",
    "torch>=2.2",
    "sentencepiece>=0.2",
    "sacremoses>=0.1",
]
# Alternate OCR engine (PP-OCR). Slower here, kept for non-Latin sources.
rapidocr = [
    "rapidocr-onnxruntime>=1.4",
]
# Region auto-detection (`lintranslator.calibrate`). The GUI deliberately has no
# auto-detect button and the pipeline never calls it, so numpy is not needed to
# run the app - only to use the helper, or to run the test suite.
calibrate = [
    "numpy>=1.26",
]
# Keep the panel above other windows under XWayland, by setting
# `_NET_WM_STATE_ABOVE`. Without it the panel still runs; it says why it cannot
# stay on top.
x11 = [
    "python-xlib>=0.33",
]
# `pytest` and the suite's own imports. `numpy` is repeated rather than pulled in
# from `calibrate` because extras cannot reference each other.
test = [
    "pytest>=8",
    "numpy>=1.26",
]

[project.scripts]
lintranslator = "lintranslator.cli:main"

[build-system]
# >=77 for PEP 639: `license = "MIT"` as an SPDX expression and `license-files`.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lintranslator"]
