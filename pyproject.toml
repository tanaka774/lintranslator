[project]
name = "lintranslator"
# Single-sourced from `lintranslator.__version__` below: two hand-kept copies of
# the same number drift, and the one in the built metadata is the one users see.
dynamic = ["version"]
description = "Screen translator for Linux: watches a screen region, reads it with OCR and translates it (Wayland/KDE first)"
readme = "README.md"
# The app is MIT. It ships no model: every backend talks to an endpoint, and
# NOTICE lists what it does download.
license = "MIT"
# NOTICE has to travel with the package. `license-files` replaces setuptools'
# legacy NOTICE/AUTHORS globs, so naming only LICENSE dropped it - and NOTICE is
# where the OCR language data's terms and the GUI libraries' LGPL are stated.
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "tanaka" }]
keywords = [
    "translation",
    "ocr",
    "tesseract",
    "screen-capture",
    "wayland",
    "kde",
    "games",
    "overlay",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: GTK",
    "Environment :: X11 Applications :: KDE",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Japanese",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
    "Topic :: Text Processing :: Linguistic",
]
# Tested on 3.12 (the floor) and on 3.14, which is what the development venv
# runs; CI covers all three. It used to say `<3.14`, which made pip refuse to
# install on the very interpreter the suite is green on.
requires-python = ">=3.12,<3.15"
dependencies = [
    "pillow>=10.0",
    "jeepney>=0.9",
    "pytesseract>=0.3.13",
]

# Where to file things. Without this, an index page shows the version and the
# summary and no way at all to reach the source.
[project.urls]
Homepage = "https://github.com/tanaka774/lintranslator"
Repository = "https://github.com/tanaka774/lintranslator"
Issues = "https://github.com/tanaka774/lintranslator/issues"
Changelog = "https://github.com/tanaka774/lintranslator/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# No translation extra. Local translation is a model server the user runs, reached
# through the `chat` backend, so nothing here installs a model runtime.
# There was a `rapidocr` extra here. It advertised PP-OCR as a second OCR engine,
# but no engine class was ever written: `ocr.py` hardcodes tesseract and the
# config's `ocr.engine` value went nowhere. An extra that installs a package the
# app never imports is worse than no extra, so it is gone until the engine is
# real - see the Roadmap.
# Region auto-detection (`lintranslator.calibrate`). The GUI deliberately has no
# auto-detect button and the pipeline never calls it, so numpy is not needed to
# run the app - only to use the helper, or to run the test suite.
calibrate = [
    "numpy>=1.26",
]
# Keep the panel above other windows under XWayland, by setting
# `_NET_WM_STATE_ABOVE`. Without it the panel still runs; it says why it cannot
# stay on top.
x11 = [
    "python-xlib>=0.33",
]
# `pytest` and the suite's own imports. `numpy` is repeated rather than pulled in
# from `calibrate` because extras cannot reference each other.
test = [
    "pytest>=8",
    "numpy>=1.26",
]

[project.scripts]
lintranslator = "lintranslator.cli:main"

[build-system]
# >=77 for PEP 639: `license = "MIT"` as an SPDX expression and `license-files`.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lintranslator"]

# The `.desktop` entry and its launcher are package data, not repo furniture:
# `lintranslator install-desktop` copies them out of the installed package, which
# is the only way a wheel install can get them.
[tool.setuptools.package-data]
lintranslator = ["data/*"]

# The version lives in `lintranslator/__init__.py` and nowhere else.
[tool.setuptools.dynamic]
version = { attr = "lintranslator.__version__" }
